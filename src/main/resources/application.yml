spring:
  application:
    name: shopnow

  datasource:
    url: jdbc:postgresql://localhost:5432/shopnow
    username: shopnow
    password: shopnow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.shopnow: DEBUG
    org.hibernate.SQL: DEBUG
